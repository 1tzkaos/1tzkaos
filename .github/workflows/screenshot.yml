name: Site screenshot

on:
  schedule:
    # Ten minutes after the stats refresh, and off the top of the hour:
    # GitHub documents schedule delays and dropped runs under peak load.
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    # Prebuilt image ships the browsers, so no 1-2 min Chromium download per run
    # and nothing gets installed into the repo itself.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Capture the live site
        run: |
          npx --yes playwright@1.62.1 screenshot \
            --viewport-size=1440,900 \
            --full-page \
            --wait-for-timeout=5000 \
            https://1tzkaos.github.io/ assets/site-preview.png

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets/site-preview.png)" ]; then
            echo "screenshot unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-preview.png
          git commit -m "chore: refresh site preview"
          git push
