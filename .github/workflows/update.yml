name: Update README

on:
  schedule:
    # Odd minute on purpose: GitHub documents schedule delays and dropped runs
    # at the start of every hour under load.
    - cron: '37 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Run tests
        run: node --test "scripts/**/*.test.mjs"

      - name: Refresh README
        env:
          # Optional. /api/v1/stats currently serves without a key; this is a
          # no-op unless the secret exists, and keeps working if auth is enforced.
          DEXPLOIT_API_KEY: ${{ secrets.DEXPLOIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
